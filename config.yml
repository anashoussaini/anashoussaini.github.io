baseURL: "https://anashoussaini.github.io/"
title: Anas Houssaini
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Papers
          url: papers/
          weight: 1
        - name: Projects
          url: projects/
          weight: 2
        - name: Blog
          url: blog/
          weight: 3

params:
    description: "Anas Houssaini, Applied Scientist Intern at Amazon FAR and MSc student at McGill and Mila, working on offline RL, dexterous manipulation, and world models."
    author: Anas Houssaini
    googleAnalyticsID: "G-LE3F13RMP1"
    DateFormat: "January 2006"
    defaultTheme: light
    disableThemeToggle: true
    hideFooter: false
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["papers","projects","blog"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true

    # Author names rendered in bold in paper author lists (both spellings appear in publications).
    highlightAuthors: ["Anas Houssaini", "Anas El Houssaini"]

    schema:
        publisherType: Person
        sameAs:
            - https://scholar.google.com/citations?user=Hq0AYv8AAAAJ&hl=en
            - https://github.com/anashoussaini
            - https://x.com/anashoussaini

    socialIcons:
        - name: Email
          url: mailto:elhoussainianas8@gmail.com
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=Hq0AYv8AAAAJ&hl=en
        - name: GitHub
          url: https://github.com/anashoussaini
        - name: Twitter
          url: https://x.com/anashoussaini
        - name: CV
          url: /files/Anas-Houssaini-Resume.pdf

    assets:
        disableScrollBarStyle: true
        theme_color: "#ffffff"
        msapplication_TileColor: "#ffffff"
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Anas Houssaini"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2

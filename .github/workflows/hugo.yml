# Builds the Hugo site and deploys it to Cloudflare Workers (anashoussaini.com),
# then publishes a redirect-only copy to GitHub Pages so every
# anashoussaini.github.io URL forwards to the same page on anashoussaini.com.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token ("Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID
name: Deploy site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deploy that is already running.
concurrency:
  group: "deploy"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --minify
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes wrangler@4 deploy
          npx --yes wrangler@4 deploy --config workers/www-redirect/wrangler.jsonc
      - name: Build redirect-only copy for anashoussaini.github.io
        run: .github/scripts/make-redirect-site.sh public ${{ runner.temp }}/github-pages https://anashoussaini.com
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/github-pages

  # Runs only after the Cloudflare deploy succeeded, so github.io never
  # redirects to a site that failed to deploy.
  github-pages:
    needs: cloudflare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy redirect site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
